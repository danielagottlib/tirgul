<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אתר תרגול | קליניקת דניאלה גוטליב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one column of big touch targets for small hands; therapist screen is a calm form */
  --bg:#EAF5F3; --card:#FFFFFF; --ink:#22344F; --muted:#5A6B80;
  --sun:#F6B21E; --coral:#F06A4F; --leaf:#22A86A; --sky:#12A397; --line:#D2E6E2;
  --display:'Secular One','Arial Hebrew',Arial,sans-serif;
  --body:'Varela Round','Arial Hebrew',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,5.4vw,26px);text-align:center;margin:0;text-wrap:balance}
.stars{background:var(--card);border:2px solid var(--sun);border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:20px;white-space:nowrap}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:6px 12px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 0 var(--line)}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:22px;min-height:130px;justify-content:center;transition:transform .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--sky)}
.tile .big{font-size:46px;line-height:1}
.tile .sub{font-family:var(--body);font-size:14px;color:var(--muted)}
.letter{font-family:var(--display);font-size:54px;line-height:1;color:var(--coral)}
.btn{border:none;border-radius:16px;padding:12px 20px;font-family:var(--display);font-size:20px;background:var(--sky);color:#fff;box-shadow:0 4px 0 #0c7d74}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0c7d74}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c98c0e}
.btn.leaf{background:var(--leaf);box-shadow:0 4px 0 #17804f}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 #c94a38}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pic{font-size:120px;line-height:1.1;user-select:none}
.word{font-family:var(--display);font-size:40px;line-height:1.2}
.word .hl{color:var(--coral)}
.sentence{font-family:var(--display);font-size:30px}
.progress{font-variant-numeric:tabular-nums;color:var(--muted)}
.rec{display:inline-flex;align-items:center;gap:6px;border:2px dashed var(--coral);border-radius:16px;padding:10px 16px;font-family:var(--display);font-size:18px;color:var(--coral);cursor:pointer;background:#fff}
.rec input{position:absolute;opacity:0;width:1px;height:1px}
audio{max-width:100%}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.choices.four{grid-template-columns:repeat(2,1fr)}
.choice{background:var(--card);border:3px solid var(--line);border-radius:20px;font-size:64px;padding:12px 0;line-height:1.2}
.choice small{display:block;font-size:15px;font-family:var(--body);color:var(--muted)}
.choice.ok{border-color:var(--leaf);background:#E6F7EE}
.choice.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.mcard{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:var(--sky);font-size:44px;color:#fff;display:flex;align-items:center;justify-content:center}
.mcard.open{background:#fff}
.mcard.done{background:#E6F7EE;border-color:var(--leaf)}
.dots{display:flex;gap:10px}
.dot{width:44px;height:44px;border-radius:50%;border:3px solid var(--sun);background:#fff;font-size:22px}
.dot.on{background:var(--sun)}
.scene{position:relative;width:100%;aspect-ratio:1;max-width:150px;margin:0 auto}
.scene span{position:absolute;line-height:1}
.scene .box{font-size:60px;left:50%;top:50%;transform:translate(-50%,-50%)}
.scene .ball{font-size:36px}
.code-in{font-family:var(--display);font-size:34px;letter-spacing:.15em;text-align:center;width:100%;max-width:320px;padding:10px;border:3px solid var(--line);border-radius:16px;direction:ltr;text-transform:uppercase}
.err{color:var(--coral);min-height:1.5em}
.cheer{font-family:var(--display);font-size:26px;color:var(--leaf);min-height:1.4em}
.note{background:#FFF6DC;border-radius:14px;padding:10px 14px;font-size:15px}
/* therapist */
.form{display:flex;flex-direction:column;gap:14px}
fieldset{border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:0}
legend{font-family:var(--display);padding:0 6px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.checks label{display:flex;gap:8px;align-items:center}
.checks input{width:20px;height:20px}
.txt{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.codebig{font-family:var(--display);font-size:44px;letter-spacing:.12em;direction:ltr;text-align:center;color:var(--sky)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.mono{direction:ltr;font-family:var(--display);letter-spacing:.08em;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(30,42,68,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .card{max-width:520px;width:100%}
.pop-in{animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.sky{position:relative;width:100%;height:min(62vh,480px);border-radius:18px;overflow:hidden;background:linear-gradient(#BFE2FF,#EAF6FF)}
.balloon{position:absolute;bottom:-130px;width:92px;height:112px;border:none;border-radius:50% 50% 46% 46%;background:var(--c);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);animation:rise linear forwards;display:flex;align-items:center;justify-content:center;padding:0}
.balloon::after{content:"";position:absolute;bottom:-34px;left:50%;width:2px;height:34px;background:#8796ad}
.balloon span{font-size:44px;line-height:1}
.balloon.popped{background:transparent;box-shadow:none;transform:scale(1.4)}
.balloon.popped::after{display:none}
.sky.paused .balloon{animation-play-state:paused}
@keyframes rise{to{transform:translateY(calc(-1 * min(62vh,480px) - 260px))}}
.track{width:100%;overflow:hidden;border-bottom:6px solid #8796ad;padding:8px 0 4px}
.train{display:flex;gap:6px;align-items:flex-end;justify-content:flex-start;transition:transform 3s ease-in}
.train.go{transform:translateX(-115%)}
.engine{font-size:clamp(44px,13vw,64px);line-height:1}
.wagon{width:clamp(44px,14vw,80px);height:clamp(44px,14vw,72px);border-radius:12px;background:var(--coral);border-bottom:8px solid #c94a38;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;text-align:center;line-height:1.1;overflow:hidden}
.platform{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.pitem,.litem,.ritem{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pitem[disabled]{opacity:.25}
.plabel{font-family:var(--display);font-size:16px;line-height:1.2}
.plabel.big{font-size:30px;color:var(--coral);padding:12px 0}
.plabel .hl{color:var(--coral)}
.board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,18vw,140px);width:100%;touch-action:none}
.board .col{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.ln{stroke:var(--sky);stroke-width:6;stroke-linecap:round}
.ln.tmp{stroke:var(--sun);stroke-dasharray:10 8}
.litem.sel{border-color:var(--sun)}
.litem.ok,.ritem.ok{border-color:var(--leaf);background:#E6F7EE}
.ritem{min-height:92px;justify-content:center}
.ritem.no{animation:shake .35s}
.shadow{font-size:52px;filter:brightness(0);opacity:.3}
.ritem.ok .shadow{filter:none;opacity:1}
.wheelbox{position:relative;width:240px;height:240px}
.wheel{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#FFE6A3 0 45deg,#CFE6FA 45deg 90deg,#FFE6A3 90deg 135deg,#CFE6FA 135deg 180deg,#FFE6A3 180deg 225deg,#CFE6FA 225deg 270deg,#FFE6A3 270deg 315deg,#CFE6FA 315deg 360deg);border:6px solid var(--sun);display:flex;align-items:center;justify-content:center}
.wheel span{position:absolute;font-size:30px;font-family:var(--display);color:var(--coral)}
.wheel.spin{animation:spin 1.6s cubic-bezier(.2,.7,.3,1)}
@keyframes spin{to{transform:rotate(1440deg)}}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:30px;color:var(--coral)}
.btn[disabled]{opacity:.4}
.brand{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.brand span{font-family:var(--display);font-size:26px;color:var(--coral);line-height:1.2;text-wrap:balance}
.brand small{color:var(--muted);font-size:16px}
.brand.small span{font-size:18px}
.logo{width:min(240px,62vw);height:auto;display:block}
.brand.small .logo{width:130px}
.hero{width:100%;max-width:340px;height:auto;display:block}
.hero .wave{transform-origin:196px 166px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.hero .dani{transform-origin:160px 200px;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2px) scale(1.01)}}
.hero .head{transform-origin:160px 140px;animation:nod 5s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
.hero .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.hero .mouth{transform-box:fill-box;transform-origin:center top}
.hero.talking .mouth{animation:talk .22s ease-in-out infinite alternate}
.hero .avimg{transform-origin:160px 200px;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.hero.talking .avimg{animation:talkbob .7s ease-in-out infinite alternate}
@keyframes talkbob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes talk{from{transform:scaleY(.45)}to{transform:scaleY(1.25)}}
.gsel{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 14px;background:#fff;font-size:20px}
.doorway{position:relative;width:100%;max-width:340px;perspective:700px}
.door{position:absolute;inset:0;border-radius:22px;background:linear-gradient(90deg,#C77B3F,#B06A33);border:8px solid #8A4F22;transform-origin:right center;padding:0;cursor:pointer}
.started .door{animation:knock .22s ease-in-out 0s 2,knock .22s ease-in-out .75s 2,doorOpen 1.2s ease-in-out 2.5s forwards}
.knockhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:18px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.started .knockhint{display:none}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.song .ly{animation-play-state:paused}
.song.started .ly{animation-play-state:running}
.closing .ly{animation-play-state:running}
.mute{padding:4px 8px;font-size:18px}
.door::before{content:"";position:absolute;inset:14px 18px;border:4px solid rgba(255,255,255,.18);border-radius:10px}
.knob{position:absolute;left:18px;top:50%;width:18px;height:18px;border-radius:50%;background:var(--sun)}
.closing .door{animation:shut 1.2s ease-in-out 1s both}
@keyframes knock{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes doorOpen{to{transform:rotateY(-105deg);opacity:0}}
.doorway.started .door{pointer-events:none}
@keyframes shut{from{transform:rotateY(-105deg);opacity:.15}to{transform:rotateY(0);opacity:1}}
.lyrics{display:flex;flex-direction:column;gap:2px;align-items:center}
.ly{font-family:var(--display);font-size:28px;opacity:0;animation:lyin .5s ease-out var(--d) forwards}
.ly.name{font-size:40px;color:var(--coral)}
@keyframes lyin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chat{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px}
.bubble{position:relative;border-radius:20px;padding:12px 18px;font-family:var(--display);font-size:24px;line-height:1.35;max-width:85%}
.bubble.from-dani{align-self:flex-start;background:#fff;border:3px solid var(--sky);margin-top:6px}
.bubble.from-dani::before{content:"";position:absolute;top:-16px;right:40px;border:8px solid transparent;border-bottom:10px solid var(--sky)}
.bubble.from-kid{align-self:flex-end;background:#FFF1C9;border:3px solid var(--sun);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bubble.from-kid::before{content:"";position:absolute;bottom:-17px;left:34px;border:8px solid transparent;border-top:10px solid var(--sun)}
.bubble .name{color:var(--coral);font-size:30px}
.bubble .kid{font-size:34px}
.pitem.ready{border-color:var(--sun);background:#FFF6DC;animation:bob2 .9s ease-in-out infinite;touch-action:none;cursor:grab}
@keyframes bob2{50%{transform:translateY(-8px)}}
.flying{position:fixed;z-index:60;margin:0;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.drag-hint{font-family:var(--display);font-size:22px;color:var(--coral)}
.wagon.target{outline:4px dashed var(--sun);outline-offset:3px;animation:pulse 1s ease-in-out infinite;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.08)}}
.wagon.bump{animation:bump .4s ease-out}
@keyframes bump{40%{transform:translateY(-10px)}}
.creature{display:flex;align-items:center;gap:6px;justify-content:center}
.cpic{line-height:1;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.sbub{position:relative;background:#fff;border:3px solid var(--coral);border-radius:22px;padding:6px 16px;font-family:var(--display);font-size:40px;color:var(--coral);align-self:flex-start}
.sbub::before{content:"";position:absolute;right:-14px;bottom:10px;border:8px solid transparent;border-left:12px solid var(--coral)}
.cline{font-family:var(--display);font-size:22px}
.plabel.syl{background:#fff;border:2px solid var(--coral);border-radius:12px;padding:0 8px;color:var(--coral);font-size:20px}
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:max(280px,calc(100vh - 270px));margin:0 auto}
.egg{border:none;background:none;padding:0;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.shell{display:block;width:72%;height:88%;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,transparent 13%),repeating-linear-gradient(135deg,hsl(var(--h) 80% 80%) 0 12px,hsl(var(--h) 80% 72%) 12px 24px);border:3px solid hsl(var(--h) 50% 60%)}
.egg.cracking .shell{animation:eggshake .3s ease-in-out 3}
@keyframes eggshake{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.egg.hatched{background:#FFF6DC;border-radius:18px}
.monster{position:relative;width:180px;height:180px;border-radius:50% 50% 44% 44%;background:#8E6CEF;margin:8px auto 4px;transform:scale(var(--s));transition:transform .3s;box-shadow:inset -14px -16px 0 rgba(0,0,0,.12);cursor:pointer}
.m-eyes{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;gap:22px}
.m-eyes span{width:38px;height:38px;border-radius:50%;background:#fff;position:relative}
.m-eyes span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#22344F;top:12px;left:11px}
.m-mouth{position:absolute;left:50%;top:96px;width:90px;height:30px;transform:translateX(-50%);background:#3A1D5E;border-radius:0 0 50px 50px;transition:height .2s}
.monster.hungry .m-mouth{height:56px;animation:open 1s ease-in-out infinite}
@keyframes open{50%{height:44px}}
.monster.munch .m-mouth{animation:munch .15s linear 4}
@keyframes munch{50%{height:8px}}
.m-horn{position:absolute;top:-14px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:30px solid #FFC43D}
.m-horn.l{left:32px}.m-horn.r{right:32px}
.pond{position:relative;width:100%;min-height:200px;border-radius:18px;background:linear-gradient(#9ED9F0,#6CC3E6);padding:70px 8px 24px}
.pads{display:flex;gap:6px;justify-content:space-between;align-items:center;flex-direction:row}
.pad{width:clamp(44px,12vw,62px);height:clamp(44px,12vw,62px);border-radius:50%;border:none;background:radial-gradient(circle at 50% 40%,#7ED67E,#3F9E4A);display:flex;align-items:center;justify-content:center;padding:0}
.pad .plabel.syl{font-size:15px;padding:0 4px}
.pad.next{outline:4px dashed var(--sun);outline-offset:3px;animation:pulse 1s ease-in-out infinite}
.pad.past{opacity:.7}
.fly{font-size:30px;animation:wiggle .6s ease-in-out infinite}
.fly.eaten{transform:scale(0);transition:transform .3s}
.frog{position:absolute;font-size:52px;line-height:1;width:56px;text-align:center;pointer-events:none}
.wrapside{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;width:100%}
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);width:190px;height:190px;gap:3px;background:var(--line);border-radius:12px;padding:3px}
.puzzle.done{gap:0;padding:0;background:transparent;transition:all .4s}
.pz{position:relative;overflow:hidden;background:#EEF3F7;border-radius:6px}
.pz .pzin{position:absolute;width:400%;height:200%;display:flex;align-items:center;justify-content:center;font-size:165px;line-height:1;visibility:hidden}
.pz.on{background:#fff}
.pz.on .pzin{visibility:visible}
.pz.new{animation:popin .5s ease-out}
.pzq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#B5C3CF;font-size:22px}
.wsyl{font-family:var(--display);font-size:20px;color:var(--coral)}
.scenebox{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;container-type:inline-size;box-shadow:inset 0 0 0 3px rgba(0,0,0,.05)}
.scenebox.photo{background:#CFE8F7}
.photoin{position:absolute;inset:0;background-size:100% 100%;animation:kenburns 26s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-1%)}}
.photoin .sitem .se{opacity:0}
.photoin .sitem{border-radius:50%}
.photoin .sitem.glow::before{content:"";position:absolute;inset:-12%;border-radius:50%;border:4px solid #FFD84D;box-shadow:0 0 16px 4px rgba(255,196,61,.8),inset 0 0 12px rgba(255,216,77,.6);animation:pulse 1.4s ease-in-out infinite;pointer-events:none}
.photoin .sitem.nope::before{content:"";position:absolute;inset:-6%;border-radius:50%;border:3px dashed rgba(255,255,255,.9)}
.glint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.22) 50%,transparent 58%);background-size:260% 100%;animation:glint 11s linear infinite}
@keyframes glint{from{background-position:130% 0}to{background-position:-130% 0}}
.bg-park{background:radial-gradient(ellipse at 50% 120%,#6FC260 0 50%,transparent 51%),linear-gradient(#A9DCFF 0 55%,#86CF75 55%)}
.bg-sea{background:linear-gradient(#B5E1FF 0 30%,#4FB3E3 30% 70%,#F3D9A4 70%)}
.bg-kitchen{background:linear-gradient(#FFF1D6 0 50%,#B5835A 50% 53%,#FFF6E6 53% 60%,#E7BC88 60% 80%,#DCE7EF 80%);}

.house{position:relative;width:45%;height:86%;margin-bottom:6%}
.house .plot{position:absolute;left:-6%;right:-6%;bottom:-8px;height:14px;border-radius:8px;background:#B98A5A}
.hb{position:absolute;left:4%;right:4%;height:20%;background:var(--c);border-radius:4px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);background-image:linear-gradient(90deg,transparent 48%,rgba(0,0,0,.12) 48% 52%,transparent 52%)}
.hb.b1{bottom:0}.hb.b2{bottom:20%}.hb.b3{bottom:40%}
.hroof{position:absolute;left:-8%;right:-8%;bottom:60%;height:36%;background:#8E4B2E;clip-path:polygon(50% 0,100% 100%,0 100%)}
.hdoor{position:absolute;left:40%;width:20%;bottom:0;height:32%;background:#6B3E1F;border-radius:8px 8px 0 0}
.hwin{position:absolute;left:12%;width:18%;bottom:34%;height:16%;background:#FFF3B0;border:3px solid #fff;border-radius:4px}
.hplot.build .hb,.hplot.build .hroof{animation:dropin .45s ease-out both}
.hplot.build .b2{animation-delay:.45s}.hplot.build .b3{animation-delay:.9s}.hplot.build .hroof{animation-delay:1.35s}
.hplot.build .hdoor,.hplot.build .hwin{animation:popin .3s 1.6s ease-out both}
@keyframes abob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes dropin{from{transform:translateY(-260px)}80%{transform:translateY(6px)}to{transform:none}}
.hanimal{font-size:min(16vw,84px);line-height:1;margin-bottom:4%;transition:transform 1.1s ease-in-out,opacity 1.1s}
.hplot.ready .hanimal{animation:abob .9s ease-in-out infinite alternate}
.hplot.move .hanimal,.hplot.say .hanimal,.hplot.done .hanimal{transform:translateX(min(22vw,120px)) scale(.55);transform-origin:50% 100%}
.hplot.say .hanimal,.hplot.done .hanimal{transition:none}
.hplot.done .house::after{content:"💛";position:absolute;left:50%;top:-10%;font-size:34px;transform:translateX(-50%);animation:popin .4s ease-out}
.hplot2{position:relative;width:min(80vw,380px);height:min(50vw,230px);background:linear-gradient(#DFF3FF 0 74%,#9BD77A 74%);border-radius:20px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.house2{position:relative;width:62%;height:94%;margin-bottom:5%}
.h2animal{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:min(14vw,72px);line-height:1;z-index:1;animation:abob 1s ease-in-out infinite alternate}
.p-floor{position:absolute;left:-4%;right:-4%;bottom:0;height:9%;background:#B98A5A;border-radius:6px;z-index:2}
.p-wl,.p-wr{position:absolute;bottom:9%;width:17%;height:52%;background:var(--c);border-radius:4px 4px 0 0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);background-image:repeating-linear-gradient(0deg,transparent 0 22%,rgba(0,0,0,.12) 22% 25%);z-index:2}
.p-wl{left:2%}.p-wr{right:2%}
.p-roof{position:absolute;left:-10%;right:-10%;bottom:60%;height:38%;background:#8E4B2E;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:2}
.p-deco{position:absolute;inset:0;z-index:3;pointer-events:none}
.p-deco::before{content:"💛";position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:min(7vw,30px)}
.p-deco::after{content:"🌷🌼";position:absolute;right:-16%;bottom:2%;font-size:min(6vw,26px)}
.house2 .new{animation:dropin .5s ease-out both}
.house2 .p-deco.new{animation:popin .5s ease-out both}
.hplot2.done .house2{animation:popin .6s ease-out}
.farmscene{position:relative;width:min(94vw,860px,calc((100vh - 390px)*1.79));aspect-ratio:1024/572;background-size:cover;background-position:center;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.fspot{position:absolute;width:17%;height:33%;transform:translateX(-50%)}
.fspot .fa{position:absolute;left:10%;width:80%;bottom:6%;z-index:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.fspot.cur .fa{animation:abob .8s ease-in-out infinite alternate}
.fspot.cur::before{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;border-radius:50%;background:radial-gradient(rgba(255,240,150,.9),rgba(255,240,150,0) 70%);animation:pulse 1.2s ease-in-out infinite}
.fspot .p-wl,.fspot .p-wr{width:15%;height:60%}
.fspot .p-roof{bottom:66%;height:40%}
.fspot .p-deco::before{top:18%}
.fspot .new{animation:fly .6s ease-in both}
@keyframes fly{from{transform:translate(var(--px),var(--py)) scale(.5) rotate(-25deg);opacity:.6}to{transform:none;opacity:1}}
.fspot .p-roof.new{animation:flyroof .6s ease-in both}
@keyframes flyroof{from{transform:translate(var(--px),var(--py)) scale(.5);opacity:.6}to{transform:none;opacity:1}}
.fgirl{position:absolute;bottom:2%;right:-22%;width:20%;z-index:5;animation:fgwalk 2.8s ease-out forwards}
.fgirl.yay{animation:girljump .4s ease-in-out infinite alternate;right:16%}
@keyframes fgwalk{to{right:16%}}
.fconf{position:absolute;top:-6%;width:10px;height:16px;border-radius:3px;background:hsl(var(--h),85%,60%);z-index:6;animation:confall 2.4s var(--d) linear forwards}
@keyframes confall{to{transform:translateY(560px) rotate(540deg)}}
.reps{display:flex;gap:8px;justify-content:center}
.reps i{width:18px;height:18px;border-radius:50%;background:#E6E1F5;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.reps i.on{background:#F6B21E}
.zoo{position:relative;padding-bottom:84px;overflow:hidden;min-width:min(86vw,560px)}
.zoo .street .mini{width:min(22vw,112px);height:min(24vw,120px)}
.zoo .street .walls{height:56%;left:10%;right:10%}
.zoo .street .roof{height:36%;bottom:54%}
.zoo .street span{font-size:min(9vw,44px)}
.zoogirl{font-size:72px!important}
.zoogirl{position:absolute;bottom:0;right:-60px;font-size:60px;line-height:1;animation:girlwalk 2.6s linear forwards}
.zoogirl.yay{animation:girljump .45s ease-in-out infinite alternate;right:calc(50% - 30px)}
@keyframes girlwalk{to{right:calc(50% - 30px)}}
@keyframes girljump{from{transform:translateY(0)}to{transform:translateY(-22px)}}
.street{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.street .mini{position:relative;width:74px;height:80px;animation:popin .4s var(--d) ease-out both}
.street .walls{position:absolute;left:8px;right:8px;bottom:0;height:46px;background:var(--c);border-radius:4px}
.street .roof{position:absolute;left:0;right:0;bottom:44px;height:30px;background:#8E4B2E;clip-path:polygon(50% 0,100% 100%,0 100%)}
.street span{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:30px}
.slotwin{perspective:900px}
.flipcard{position:absolute;inset:10px;transform-style:preserve-3d}
.flipcard.flipping{animation:cardflip .9s ease-in-out forwards}
.flipcard.shown{transform:rotateY(180deg)}
@keyframes cardflip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(1.06)}100%{transform:rotateY(180deg) scale(1)}}
.fc-back,.fc-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden}
.fc-back.cback{inset:0}
.fc-front{transform:rotateY(180deg);background:#fff}
.fc-front img{width:100%;height:100%;object-fit:cover;display:block}
.fc-front .ccap{position:absolute;left:0;right:0;bottom:0;margin:0;border-radius:0;background:rgba(255,255,255,.92);padding:6px 8px;font-size:min(5vw,22px)}
.ghost.armed{background:#FFE3DE;color:#C0392B;border-color:#F3A79A}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(78vw,560px,calc((100vh - 280px)*1.9))}
.gslot{position:relative;aspect-ratio:1;border-radius:14px}
.gslot.done{border:3px dashed #D9D0F5;display:flex;align-items:center;justify-content:center;color:#B9A9EE;font-size:28px}
.gcard{position:absolute;inset:0;perspective:700px;border-radius:14px;transition:transform .12s,box-shadow .12s}
.gcard .flipcard{inset:0}
.gcard .cback span{font-size:min(9vw,52px)}
.gcard.lit{transform:scale(1.08);box-shadow:0 0 0 5px #FFE066,0 0 26px 8px rgba(255,214,0,.85);z-index:2}
.cardzoom{position:fixed;inset:0;z-index:70;background:rgba(40,30,80,0);transition:background .5s}
.cardzoom.on{background:rgba(40,30,80,.45)}
.zcard{position:fixed;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 0 6px #fff,0 16px 40px rgba(0,0,0,.35);transition:left .6s ease-in-out,top .6s ease-in-out,width .6s ease-in-out,height .6s ease-in-out,opacity .6s}
.zcard img{width:100%;height:100%;object-fit:cover;display:block}
.zcard .cload,.fc-front .cload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:min(6vw,26px);text-align:center;padding:16px;background:#FFF8E6;color:var(--ink)}
.zcard .ccap{position:absolute;left:0;right:0;bottom:0;margin:0;background:rgba(255,255,255,.93);padding:8px;font-family:var(--display);font-size:min(5vw,24px);text-align:center}
.zpanel{position:fixed;left:50%;transform:translateX(-50%);width:min(90vw,460px);background:#fff;border-radius:18px;padding:10px 14px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.abrow{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}
.donepile{position:relative;width:96px;height:124px;flex:none}
.donepile i{position:absolute;left:6px;top:16px;width:76px;height:96px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 2px #8E6CEF,0 3px 6px rgba(0,0,0,.15);background:repeating-linear-gradient(45deg,#8E6CEF 0 8px,#A58BF5 8px 16px);transform:translate(calc(var(--k)*2px),calc(var(--k)*-3px)) rotate(calc(var(--r)*1deg))}
.donepile i.empty{background:none;box-shadow:none;border:3px dashed #C9BDF5}
.donepile i.newtop{animation:intopile .7s ease-out}
@keyframes intopile{from{transform:translate(220px,-30px) scale(2.6) rotate(18deg);opacity:.2}}
.donepile b{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-family:var(--display);font-size:18px;color:#8E6CEF}
@keyframes cslide{from{transform:translateY(-70%) scale(.92)}to{transform:none}}
.cback.flipout{animation:cflip .45s ease-in forwards}
@keyframes cflip{to{transform:perspective(800px) rotateY(90deg) scale(.9)}}
.slotlights{display:flex;gap:10px}
.slotlights i{width:12px;height:12px;border-radius:50%;background:#FFE066;box-shadow:0 0 6px #FFE066;animation:blinkl 1s steps(2) calc(var(--k)*-.12s) infinite}
.slotm.running .slotlights i{animation-duration:.25s}
@keyframes blinkl{50%{background:#fff;box-shadow:none}}
.bigspin{font-size:26px;padding:16px 34px;border-radius:999px;animation:pulse 1.1s ease-in-out infinite}
/* absurd picture cards */
.deck{position:relative;width:min(70vw,260px);aspect-ratio:3/4;margin:10px auto 14px}
.dcardx{position:absolute;inset:0;transform:translate(calc(var(--k)*4px),calc(var(--k)*-4px)) rotate(calc(var(--k)*2deg - 4deg))}
.cback{width:100%;height:100%;border-radius:22px;background:repeating-linear-gradient(45deg,#8E6CEF 0 14px,#7B58E0 14px 28px);border:6px solid #fff;box-shadow:0 8px 18px rgba(34,52,79,.25);display:flex;align-items:center;justify-content:center}
.cback span{font-size:70px;background:#fff;border-radius:50%;width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.deck.shuffling .dcardx{animation:shufl .5s ease-in-out 3}
.deck.shuffling .dcardx:nth-child(2n){animation-name:shufr}
@keyframes shufl{50%{transform:translate(-70%,-6%) rotate(-14deg)}}
@keyframes shufr{50%{transform:translate(70%,-6%) rotate(14deg)}}
.bigcard{position:relative;width:min(88vw,460px);border-radius:24px;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 24px rgba(34,52,79,.25);background:#fff}
.bigcard img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.bigcard.flipin{animation:flipin .6s ease-out}
@keyframes flipin{from{transform:perspective(800px) rotateY(90deg) scale(.8)}to{transform:none}}
.cload{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ccap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);font-family:var(--display);font-size:26px;padding:8px 12px;animation:popin .4s ease-out}
.slot.pair2{display:flex;gap:28px;font-size:96px;animation:popin .5s ease-out}
.silly span{position:absolute;left:50%;line-height:1}
.silly .sB{font-size:110px;top:50%;transform:translate(-50%,-30%)}
.silly .sA{font-size:70px;animation:wiggle 1.2s ease-in-out infinite}
.silly.on .sA{top:-6%;transform:translateX(-50%)}
.silly.under .sB{top:8%;transform:translate(-50%,0)}
.silly.under .sA{bottom:-4%;transform:translateX(-50%)}
.silly.in .sA{top:52%;font-size:52px;transform:translate(-50%,-50%);z-index:2}
.sillybox.show .silly{animation:popin .5s ease-out}

/* ---- animated world background ---- */
body{background:#BFE6FF}
#world{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:auto}
.wrap{position:relative;z-index:1;pointer-events:none}
.wrap>*{pointer-events:auto}
.w-sky{position:absolute;inset:0;background:linear-gradient(180deg,#8FD3FF,#CDEBFF 45%,#FFF1D9 75%,#FFE2EC);background-size:100% 200%;animation:skyshift 30s ease-in-out infinite alternate}
@keyframes skyshift{to{background-position:0 100%}}
.w-layer{position:absolute;inset:0;transform:translate(calc(var(--px,0)*var(--f)*1px),calc(var(--py,0)*var(--f)*1px));transition:transform .6s ease-out}
.w-sun{position:absolute;top:4%;left:6%;width:min(24vw,130px)}
.w-rays{transform-origin:70px 70px;animation:spin2 30s linear infinite}
.w-rainbow{position:absolute;right:-8%;top:16%;width:min(60vw,520px);aspect-ratio:2/1;border-radius:999px 999px 0 0;
  background:radial-gradient(circle at 50% 100%,transparent 0 52%,#B9A4FF 52% 58%,#7FC8FF 58% 64%,#7FD196 64% 70%,#FFE066 70% 76%,#FFB36B 76% 82%,#FF8F8F 82% 88%,transparent 88%);opacity:.55}
.w-cloud{position:absolute;opacity:.95;filter:drop-shadow(0 6px 0 rgba(160,190,220,.35))}
.cl1{width:min(34vw,220px);top:9%;left:-30%;animation:drift 48s linear infinite}
.cl2{width:min(26vw,170px);top:24%;left:-30%;animation:drift 64s linear infinite;animation-delay:-28s}
.cl3{width:min(20vw,130px);top:4%;left:-30%;animation:drift 38s linear infinite;animation-delay:-15s}
@keyframes drift{to{transform:translateX(160vw)}}
.w-hab{position:absolute;width:min(10vw,58px)}
.hab1{top:30%;right:12%;animation:hab 14s ease-in-out infinite}
.hab2{top:12%;right:40%;width:min(7vw,40px);animation:hab 18s ease-in-out infinite reverse}
@keyframes hab{50%{transform:translate(-40px,-30px) rotate(-4deg)}}
.w-bird{position:absolute;width:34px}
.b1{top:20%;left:-10%;animation:drift 22s linear infinite}
.b2{top:26%;left:-10%;width:24px;animation:drift 26s linear infinite;animation-delay:-9s}
.wing{animation:flap .5s ease-in-out infinite alternate;transform-origin:20px 12px}
@keyframes flap{to{transform:scaleY(-.4)}}
.w-hills{top:auto;height:42vh;bottom:0}
.hill{position:absolute;left:-5%;width:110%;bottom:0}
.h1{height:100%}.h2{height:80%}.h3{height:58%}
.castle{position:absolute;bottom:52%;right:16%;width:min(18vw,120px)}
.flowers{position:absolute;bottom:4%;left:0;right:0;display:flex;justify-content:space-around;font-size:min(6vw,30px)}
.flowers span{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
.flowers span:nth-child(2n){animation-delay:-1.5s}
@keyframes sway{50%{transform:rotate(10deg)}}
.w-bubbles i{position:absolute;bottom:-60px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 18%,rgba(255,255,255,.25) 40%,rgba(160,210,255,.25));border:2px solid rgba(255,255,255,.7);animation:bubble 14s linear infinite}
.w-bubbles i:nth-child(1){left:8%;animation-delay:0s}.w-bubbles i:nth-child(2){left:22%;width:16px;height:16px;animation-delay:-3s}
.w-bubbles i:nth-child(3){left:36%;animation-delay:-7s}.w-bubbles i:nth-child(4){left:52%;width:34px;height:34px;animation-delay:-10s}
.w-bubbles i:nth-child(5){left:66%;width:18px;height:18px;animation-delay:-5s}.w-bubbles i:nth-child(6){left:78%;animation-delay:-12s}
.w-bubbles i:nth-child(7){left:90%;width:22px;height:22px;animation-delay:-2s}.w-bubbles i:nth-child(8){left:46%;width:14px;height:14px;animation-delay:-8s}
@keyframes bubble{0%{transform:translate(0,0)}50%{transform:translate(18px,-55vh)}100%{transform:translate(-10px,-115vh)}}
.burst{position:fixed;z-index:70;pointer-events:none;font-size:26px;animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(180deg);opacity:0}}
.card{background:rgba(255,255,255,.93);backdrop-filter:blur(3px)}
.top{background:rgba(255,255,255,.75);border-radius:16px;padding:6px 8px}
.brand{background:rgba(255,255,255,.7);border-radius:20px;padding:6px 16px;align-self:center}
.mplay{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:0 auto}
.mplay .monster{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(var(--s))}
.monster.full{animation:popin .6s ease-out}
.cookie2{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer}
.cookie2 .ck{font-size:min(11vw,48px);line-height:1;animation:wiggle 2s ease-in-out infinite}
.cookie2:nth-child(2n) .ck{animation-delay:-1s}
.cookie2.ready{animation:bob2 .9s ease-in-out infinite;touch-action:none;cursor:grab}

.bog{position:relative;width:min(94vw,600px,calc(100vh - 345px));min-width:min(94vw,300px);aspect-ratio:1;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#8FD6E8 0 55%,#6CC3A0 56% 62%,#4FA76F 63%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.4)}
.bigpad{position:absolute;left:50%;top:50%;width:20%;height:20%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 40%,#8EE08E,#3F9E4A);clip-path:polygon(50% 50%,100% 40%,100% 0,0 0,0 100%,100% 100%,100% 60%)}

.frog2{position:absolute;transform:translate(-50%,-60%);font-size:min(13vw,56px);line-height:1;transition:left .45s ease-out,top .45s ease-out;z-index:3;pointer-events:none}
.frog2.hop{animation:hop .45s ease-out}
@keyframes hop{50%{transform:translate(-50%,-110%) scale(1.25)}}
.tongue{position:absolute;height:9px;width:0;background:linear-gradient(90deg,#E8506F,#FF7A98);border-radius:8px;transform-origin:0 50%;z-index:4;margin-top:-4.5px;pointer-events:none}

.frog2.gulp{animation:gulp .7s ease-in-out}
@keyframes gulp{0%,100%{transform:translate(-50%,-60%)}20%{transform:translate(-50%,-60%) scale(1.12,.9)}60%{transform:translate(-50%,-60%) scale(.95,1.08)}}
.frog2.bigjump{transition:left .55s ease-out,top .55s ease-out;font-size:min(16vw,72px)}
.frog2.happy{animation:froghappy .5s ease-in-out 4 alternate}
@keyframes froghappy{from{transform:translate(-50%,-60%) rotate(-8deg)}to{transform:translate(-50%,-75%) rotate(8deg)}}
.ripple{position:absolute;left:50%;top:52%;width:20%;aspect-ratio:1;border-radius:50%;border:4px solid rgba(255,255,255,.8);transform:translate(-50%,-50%) scale(.6);animation:ripple 1.4s ease-out forwards;pointer-events:none;z-index:2}

/* codes of children who finished treatment are listed in blocked.js on the site; such a code no longer opens the site */
const normCode=c=>String(c||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
function isBlocked(code){return (window.BLOCKED||[]).some(b=>normCode(b)===normCode(code))}
/* a new code can replace an old one (window.REPLACED in blocked.js): the old code moves the child to the new code, keeping stars & stickers */
const fmtCode=c=>{const x=normCode(c);return x.slice(0,4)+'-'+x.slice(4)};
function replacedBy(code){const R=window.REPLACED||{};let c=fmtCode(code),n=0;while(R[c]&&n++<10)c=fmtCode(R[c]);return c===fmtCode(code)?null:c}
function migrateCode(oldC,newC){const forms=[String(oldC).toUpperCase(),fmtCode(oldC),normCode(oldC)];['stars-','prog-','name-','g-'].forEach(k=>{if(store.get(k+newC)!=null)return;for(const f of forms){const v=store.get(k+f);if(v!=null){store.set(k+newC,v);break}}})}
function blockFileText(addBlocked,addReplaced){const B=new Set((window.BLOCKED||[]).map(fmtCode));(addBlocked||[]).forEach(c=>B.add(fmtCode(c)));
  const R={};Object.entries(window.REPLACED||{}).forEach(([o,n])=>R[fmtCode(o)]=fmtCode(n));Object.entries(addReplaced||{}).forEach(([o,n])=>R[fmtCode(o)]=fmtCode(n));
  return 'window.BLOCKED=[\n'+[...B].map(c=>"'"+c+"'").join(',\n')+'\n];\nwindow.REPLACED={\n'+Object.entries(R).map(([o,n])=>"'"+o+"':'"+n+"'").join(',\n')+'\n};\n'}

  const txt=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));const w={};try{new Function('window',txt)(w)}catch(e){}
  window.BLOCKED=w.BLOCKED||[];window.REPLACED=w.REPLACED||{};

        const p=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(Object.assign({message:'הקלטה: '+k,content:b64,branch:'main'},sha?{sha}:{}))});

function kidName(){return store.get('name-'+S.code)||''}
function kidG(){return store.get('g-'+S.code)||'b'}
function renderName(){
  const n=kidName(),g=kidG();
  app.innerHTML=`<div class="brand"><img class="logo" src="${LOGO}" alt="דניאלה גוטליב, קלינאית תקשורת M.A."></div><div class="card stage">${toyTable()}
    <h2>איך קוראים לך?</h2>
    <form id="nf" class="stage" style="width:100%">
      <label for="nameIn" class="muted">השם של הילד או הילדה</label>
      <input id="nameIn" class="txt" style="max-width:300px;text-align:center;font-size:24px" maxlength="20" value="${esc(n)}" autocomplete="off">
      <div class="row" role="radiogroup" aria-label="בן או בת">
        <label class="gsel"><input type="radio" name="g" value="b" ${g==='b'?'checked':''}> 👦 בן</label>
        <label class="gsel"><input type="radio" name="g" value="g" ${g==='g'?'checked':''}> 👧 בת</label>
      </div>
      <div class="err" id="nerr" role="alert"></div>
      <button class="btn leaf" type="submit">המשך</button>
    </form></div>`;
  document.getElementById('nf').onsubmit=e=>{e.preventDefault();const v=document.getElementById('nameIn').value.trim();
    if(!v){document.getElementById('nerr').textContent='כתבו את השם, כדי שדניאלה תדע מי הבא.';return}
    store.set('name-'+S.code,v);store.set('g-'+S.code,(app.querySelector('input[name=g]:checked')||{}).value||'b');S.kname=v;go('welcome')};
}
function renderWelcome(){
  const n=esc(kidName()||S.kname||''),girl=kidG()==='g';
  app.innerHTML=`<div class="brand"><img class="logo" src="${LOGO}" alt="דניאלה גוטליב, קלינאית תקשורת M.A."></div><div class="card stage song">
    <div class="doorway" id="doorway">${heroSVG()}<button class="door" id="door" aria-label="דופקים בדלת"><span class="knob"></span><span class="knockhint">👆 דופקים בדלת!</span></button></div>
    <div class="chat">
      <div class="bubble from-dani ly" style="--d:3.6s">טוק טוק בדלת,<br>דניאלה שואלת:<br><b>מי הבא?</b></div>
      <div class="bubble from-kid ly" style="--d:5.4s"><span class="kid" aria-hidden="true">${girl?'👧':'👦'}</span><b class="name">${n}</b> ${girl?'ברוכה הבאה!':'ברוך הבא!'} 🎉</div>
    </div>
    <div class="row"><button class="btn sun" id="again" type="button">🚪 שוב</button><button class="btn leaf" id="start" type="button">בואו נתחיל!</button></div>
    <div class="row"><button class="ghost" id="rename" type="button" style="font-size:14px">לשנות את השם</button><button class="ghost" id="switch" type="button" style="font-size:14px">לא ${n}? כניסה עם קוד אחר</button></div></div>`;
  const dw=document.getElementById('doorway'),song=app.querySelector('.song');
  document.getElementById('door').onclick=()=>{if(dw.classList.contains('started'))return;dw.classList.add('started');song.classList.add('started');SFX.knock();
    TIMERS.push(setTimeout(()=>SFX.creak(),2600));TIMERS.push(setTimeout(()=>{const dd=document.getElementById('door');if(dd)dd.classList.add('gone')},3800));TIMERS.push(setTimeout(()=>{if(SFX.muted)return;SFX.tune();document.querySelectorAll('.hero').forEach(h=>h.classList.add('talking'));TIMERS.push(setTimeout(()=>document.querySelectorAll('.hero').forEach(h=>h.classList.remove('talking')),7400))},3600))};
  document.getElementById('start').onclick=()=>go('home');
  document.getElementById('again').onclick=()=>{S.view='welcome';render()};
  document.getElementById('rename').onclick=()=>go('name');
  document.getElementById('switch').onclick=()=>{store.del('kid-code');S.bits=null;S.code='';go('login')};
}
function byeReport(n,girl){
  const td=today();if(!td.t)return '';
  const rows=Object.entries(td.c).sort((a,b)=>b[1]-a[1]);
  const name=kidName()||(girl?'הילדה':'הילד');
  const msg=`שלום דניאלה, ${name} ${girl?'התאמנה':'התאמן'} היום באתר ${girl?'ואספה':'ואסף'} ${starsWord(td.t)}.\n${rows.map(([k,c])=>'• '+ctxLabel(k)+': '+starsWord(c)).join('\n')}`;
  return `<div class="card report"><h2>להורים: סיכום התרגול של היום</h2>
    <p>${n||(girl?'הילדה':'הילד')} ${girl?'אספה':'אסף'} היום <b>${starsWord(td.t)}</b>.</p>
    ${rows.length?`<ul>${rows.map(([k,c])=>`<li>${esc(ctxLabel(k))}: ${starsWord(c)}</li>`).join('')}</ul>`:''}
    <textarea class="txt" id="repText" rows="4" readonly hidden>${esc(msg)}</textarea>
    <div class="row" style="justify-content:flex-start"><button class="btn sun" id="copyRep" type="button">📋 העתקת הסיכום לדניאלה</button></div>
    <p class="muted" id="repOk" role="status"></p></div>`;
}
function renderBye(){
  const n=esc(kidName()),girl=kidG()==='g';
  app.innerHTML=`<div class="brand"><img class="logo" src="${LOGO}" alt="דניאלה גוטליב, קלינאית תקשורת M.A."></div><div class="card stage song started">
    <div class="doorway closing">${heroSVG()}<div class="door"><span class="knob"></span></div></div>
    <div class="chat">
      <div class="bubble from-dani ly" style="--d:.4s">התאמנת יפה היום, <b>${n}</b>!<br>אספת ${S.stars} כוכבים ⭐<br>להתראות, נתראה בפעם הבאה! 👋</div>
    </div>
    <div class="row"><button class="btn" id="back" type="button">חזרה לתרגילים</button></div></div>${byeReport(n,girl)}`;
  const cp=document.getElementById('copyRep');if(cp)cp.onclick=async()=>{const t=document.getElementById('repText');try{await navigator.clipboard.writeText(t.value);document.getElementById('repOk').textContent='הסיכום הועתק. אפשר להדביק אותו בוואטסאפ לדניאלה.'}catch(e){t.hidden=false;t.select();document.getElementById('repOk').textContent='הטקסט מסומן. מעתיקים אותו עם Ctrl+C או בלחיצה ארוכה.'}};
  SFX.whoosh();TIMERS.push(setTimeout(()=>SFX.thud(),2100));TIMERS.push(setTimeout(()=>SFX.fanfare(),600));TIMERS.push(setTimeout(()=>voice(girl?'byeG':'byeB'),1500));
  document.getElementById('back').onclick=()=>go('home');
}

/* ---------- record & play back the child's voice (works where the browser allows a microphone) ---------- */
/* The child records every utterance; it stops by itself after the child finishes talking, plays back automatically, and the game continues.
   Works on the real site (https). Where the browser has no microphone, the old "אמרתי" button is used instead. */
const REC={state:(navigator.mediaDevices&&window.MediaRecorder&&window.isSecureContext)?'unknown':'no',stream:null,gen:0,stopNow:null,
  async granted(){if(this.stream)return true;try{const p=await navigator.permissions.query({name:'microphone'});return p.state==='granted'}catch(e){return false}},
  async ensure(){if(this.state==='no')return false;if(this.stream&&this.stream.getAudioTracks().some(t=>t.readyState==='live'))return true;
    try{if(navigator.audioSession)navigator.audioSession.type='play-and-record'}catch(e){}
    try{this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});this.state='ok';return true}catch(e){this.state='no';return false}},
  /* records until the child has spoken and then been quiet for a moment, or until maxMs */
  record(maxMs,onLevel){return new Promise((res,rej)=>{try{const ch=[];const mr=new MediaRecorder(this.stream);mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
    const t0=performance.now();let spoke=false,quietSince=0,raf=0,a=null;
    const finish=()=>{cancelAnimationFrame(raf);try{a&&a.close()}catch(e){}res(new Blob(ch,{type:mr.mimeType||'audio/webm'}))};
    mr.onstop=finish;
    try{a=new (window.AudioContext||window.webkitAudioContext)();const src=a.createMediaStreamSource(this.stream);const an=a.createAnalyser();an.fftSize=512;src.connect(an);
      const buf=new Uint8Array(an.fftSize);
      const loop=()=>{an.getByteTimeDomainData(buf);let sum=0;for(const v of buf){const d=(v-128)/128;sum+=d*d}const rms=Math.sqrt(sum/buf.length);onLevel&&onLevel(Math.min(1,rms*6));
        const now=performance.now();
        if(rms>.045){spoke=true;quietSince=0}else if(spoke){if(!quietSince)quietSince=now;else if(now-quietSince>1100&&now-t0>900){REC.stopNow&&REC.stopNow();return}}
        raf=requestAnimationFrame(loop)};loop()}catch(e){}
    mr.start();const t=setTimeout(()=>{if(mr.state!=='inactive')mr.stop()},maxMs);REC.stopNow=()=>{clearTimeout(t);REC.stopNow=null;if(mr.state!=='inactive')mr.stop()}}catch(e){rej(e)}})},
  /* phones (iPhone) send all sound to the quiet ear speaker while the microphone is open:
     close the microphone after each recording and switch back to normal playback before playing it */
  release(){try{this.stream&&this.stream.getTracks().forEach(t=>t.stop())}catch(e){}this.stream=null;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{SFX.wake()}catch(e){}},
  /* plays the recording through the page's sound engine (works on phones too), louder than normal */
  play(blob){return new Promise(res=>{let fin=false;const end=()=>{if(fin)return;fin=true;res()};
    const viaEl=()=>{const url=URL.createObjectURL(blob);const au=new Audio(url);au.onended=()=>{URL.revokeObjectURL(url);end()};au.onerror=end;au.play().catch(end);setTimeout(end,15000)};
    const a=SFX.engine();if(!a||!blob.arrayBuffer){viaEl();return}
    blob.arrayBuffer().then(b=>a.decodeAudioData(b)).then(buf=>{const s=a.createBufferSource();s.buffer=buf;const g=a.createGain();g.gain.value=1.8;s.connect(g).connect(a.destination);s.onended=end;s.start();setTimeout(end,buf.duration*1000+600)}).catch(viaEl)})}
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* recording step shown inside an overlay card; calls done() when finished (or right away if no microphone) */
function recStep(host,done,opts){
  opts=opts||{};
  if(REC.state==='no'){done();return}
  const gen=REC.gen;const alive=()=>gen===REC.gen&&document.body.contains(host);
  const run=async()=>{
    const ok=await REC.ensure();if(!alive())return;
    if(!ok){host.innerHTML=`<button class="btn leaf" id="saidFallback">⭐ אמרתי!</button>`;host.querySelector('#saidFallback').onclick=()=>done();return}
    host.innerHTML=`<div class="recbox"><div class="recdot" id="recMsg">🎙️ מתכוננים...</div><div class="meter"><i id="lvl"></i></div><button class="ghost" id="recStop" type="button" style="font-size:15px">✋ סיימתי</button></div>`;
    host.querySelector('#recStop').onclick=()=>REC.stopNow&&REC.stopNow();
    await sleep(450);if(!alive())return;
    host.querySelector('#recMsg').textContent='🔴 עכשיו אומרים!';
    const blob=await REC.record(opts.max||5000,v=>{const l=host.querySelector('#lvl');if(l)l.style.width=Math.round(v*100)+'%'});
    REC.release();if(!alive())return;
    host.innerHTML=`<div class="recbox"><div class="recdot">🔊 שומעים את עצמנו...</div><div class="ears">👂</div></div>`;
    await sleep(250);if(!alive())return;
    await REC.play(blob);if(!alive())return;
    done()};
  /* the child starts the recording; stopping, playback and returning to the game are automatic */
  REC.granted().then(g=>{if(!alive())return;
    const first=!(g||REC.state==='ok');
    host.innerHTML=`<div class="recbox"><button class="btn coral recbtn" id="recGo" type="button" aria-label="לוחצים ומדברים">🎤 לוחצים ומדברים</button>${first?'<p class="muted" style="font-size:14px">להורים: בפעם הראשונה הדפדפן ישאל אם לאפשר מיקרופון. לוחצים "אישור" (Allow) פעם אחת.</p>':''}</div>`;
    host.querySelector('#recGo').onclick=()=>{SFX.unlock();run()}});
}
/* small overlay used by games that have their own "אמרתי" button */
function recOverlay(label,done,opts){
  if(REC.state==='no'){done();return}
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="card stage pop-in"><div class="sentence" style="font-size:24px">${label||''}</div><div id="rh"></div></div>`;
  document.body.appendChild(ov);S.overlay=true;recStep(ov.querySelector('#rh'),()=>{ov.remove();S.overlay=false;done()},opts);
}

/* ---------- "say it" pop-up ---------- */
function letters(){return (S.stage&&S.sound!==null&&!['pair','vocab'].includes(S.stage)&&S.stage!=='syl'&&SOUNDS[S.sound])?SOUNDS[S.sound].hl:''}
function itemHtml(it,big){
  if(it[2]==='syl')return `<div class="creature"><div class="cpic" style="font-size:${big?110:64}px">${crit(it[1],big?150:84)}</div><div class="sbub">${it[0]}!</div></div>${big?`<p class="cline">${it[3]} ${it[4]?'אומרת':'אומר'}: <b>${it[0]}</b></p>`:''}`;const L=letters();const t=L?hl(it[0],L):it[0];const isSent=it[0].includes(' ')&&S.stage!=='syl';
  return `${it[1]?`<div class="pic" style="font-size:${big?110:56}px">${it[1]}</div>`:''}<div class="${isSent?'sentence':'word'}" ${!it[1]?'style="font-size:60px;color:var(--coral)"':''}>${t}</div>`}
function sayIt(it,onDone){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="card stage pop-in">${itemHtml(it,true)}<p class="muted">${it[2]==='syl'?'עכשיו תורך! אומרים כמוהו 🗣️':'אומרים בקול 🗣️'}</p><button class="btn leaf" id="ovOk">⭐ אמרתי!</button></div>`;
  document.body.appendChild(ov);S.overlay=true;
  const fin=()=>{ov.remove();S.overlay=false;addStar();voice('cheer');onDone&&onDone()};
  if(REC.state!=='no'){const b=ov.querySelector('#ovOk');const h=document.createElement('div');b.replaceWith(h);recStep(h,fin)}
  else ov.querySelector('#ovOk').onclick=fin;
}

/* ---------- drag & fly helpers ---------- */
function flyTo(fromEl,toEl,done){
  if(!fromEl||!toEl||!fromEl.animate){done();return}
  const a=fromEl.getBoundingClientRect(),b=toEl.getBoundingClientRect();
  const g=fromEl.cloneNode(true);g.classList.add('flying');Object.assign(g.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(g);
  fromEl.style.visibility='hidden';SFX.zip();
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  g.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx/2}px,${dy/2-60}px) scale(.9) rotate(-10deg)`},{transform:`translate(${dx}px,${dy}px) scale(.4)`}],{duration:600,easing:'ease-in-out'}).onfinish=()=>{g.remove();done()};
}
function dragTo(el,getTarget,onDrop){
  el.onpointerdown=e=>{e.preventDefault();const r=el.getBoundingClientRect();const g=el.cloneNode(true);g.classList.add('flying','dragging');
    Object.assign(g.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(g);el.style.visibility='hidden';
    const ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;
    const mv=ev=>{g.style.left=(ev.clientX-ox)+'px';g.style.top=(ev.clientY-oy)+'px'};
    const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      const t=getTarget().getBoundingClientRect();const tap=Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<8;
      const over=ev.clientX>=t.left-20&&ev.clientX<=t.right+20&&ev.clientY>=t.top-40&&ev.clientY<=t.bottom+40;
      if(over||tap){g.remove();el.style.visibility='';onDrop()}
      else{g.animate([{left:g.style.left,top:g.style.top},{left:r.left+'px',top:r.top+'px'}],{duration:250}).onfinish=()=>{g.remove();el.style.visibility=''}}};
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)};
}

  };
  document.getElementById('blkBtn').onclick=()=>{const v=document.getElementById('blk').value.trim(),out=document.getElementById('blkOut');
    if(decode(v)===null){out.innerHTML='<p class="err">הקוד לא תקין. בדקי שהקלדת את כל 8 התווים.</p>';return}
    applyCodes(out,[v],null,'הקוד '+esc(v.toUpperCase())+' נחסם.')};
  app.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{const l=savedList(),r=l[+b.dataset.end];const codes=r.n?l.filter(x=>x.n===r.n).map(x=>x.c):[r.c];const out=document.getElementById('endOut');
    out.scrollIntoView({behavior:'smooth',block:'center'});applyCodes(out,codes,null,`סיום טיפול${r.n?' של '+esc(r.n):''}: ${codes.length===1?'הקוד נחסם':'כל '+codes.length+' הקודים נחסמו'}.`)});
  const ghIn=document.getElementById('ghTok');document.getElementById('ghSave').onclick=async()=>{const v=ghIn.value.trim();const st=document.getElementById('ghStat');if(!v){store.del('gh-token');st.textContent='המפתח נמחק מהמכשיר.';return}
    store.set('gh-token',v);ghIn.value='';st.textContent='בודק...';try{const r=await fetch(GH_FILE+'?ref=main',{headers:{'Authorization':'Bearer '+v,'Accept':'application/vnd.github+json'}});st.textContent=r.ok?'✓ מחובר. מעכשיו חסימות והחלפות נשמרות לבד.':'המפתח לא עובד ('+r.status+'). בדקי שנתת הרשאת Contents: Read and write למאגר tirgul.'}catch(e){st.textContent='אין חיבור ל-GitHub מהמכשיר הזה.'}};
  /* position and stage only matter for sounds: show them once a sound is ticked */
  const sndUpd=()=>{const any=SOUNDS.some((s,i)=>{const c=document.getElementById('g'+i);return c&&c.checked});app.querySelectorAll('#tf .sndonly').forEach(f=>f.hidden=!any)};
  SOUNDS.forEach((s,i)=>{const c=document.getElementById('g'+i);if(c)c.addEventListener('change',sndUpd)});sndUpd();
  setupVrec();
  const mp=document.getElementById('mgPat');
  if(mp){const boxes=[...app.querySelectorAll('.mge')],sv=document.getElementById('mgSaveBtn'),st=document.getElementById('mgStat');
    mp.onchange=()=>{const ids=((window.MY_ASSIGN||{})[mp.value])||[];boxes.forEach(b=>{b.disabled=!mp.value;b.checked=ids.includes(b.value)});sv.disabled=!mp.value;st.textContent=''};
    sv.onclick=async()=>{if(!mp.value)return;sv.disabled=true;st.textContent='שומר...';
      try{await saveAssign(mp.value,boxes.filter(b=>b.checked).map(b=>b.value));st.textContent='✓ נשמר. המטופל יראה את השינוי תוך דקה-שתיים.'}
      catch(e){st.textContent=e.message==='nokey'?'צריך קודם לחבר את המכשיר ל-GitHub (בכרטיס "חיבור ל-GitHub").':'השמירה לא הצליחה ('+e.message+'). נסי שוב.'}
      sv.disabled=false}}
  document.getElementById('chkBtn').onclick=()=>{const b=decode(document.getElementById('chk').value);document.getElementById('chkOut').textContent=b===null?'הקוד לא תקין.':'הקוד פותח: '+describe(b)};
  /* two-step buttons: the first press asks, the second press does it */
  const twoStep=(b,ask,act)=>b.onclick=()=>{if(b.dataset.armed){act();return}b.dataset.armed='1';const t=b.textContent;b.textContent=ask;b.classList.add('armed');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t;b.classList.remove('armed')}},4000)};
  const tr=document.getElementById('testReset');if(tr)twoStep(tr,'לאפס? לחצי שוב',()=>{['stars-','prog-','name-','g-'].forEach(k=>store.del(k+TEST_CODE));if(isTestCode(store.get('kid-code')||''))store.del('kid-code');tr.textContent='✓ אופס';tr.disabled=true});
  app.querySelectorAll('[data-rm]').forEach(b=>twoStep(b,'בטוחה? לחצי שוב',()=>{const l=savedList();l.splice(+b.dataset.rm,1);store.set('th-codes',JSON.stringify(l));renderTherapist()}));
  app.querySelectorAll('[data-reset]').forEach(b=>twoStep(b,'לאפס? לחצי שוב',()=>{const r=savedList()[+b.dataset.reset];if(!r)return;const forms=[String(r.c).toUpperCase(),fmtCode(r.c),normCode(r.c)];
    ['stars-','prog-','name-','g-','gender-','kidg-'].forEach(k=>forms.forEach(f=>store.del(k+f)));if(store.get('kid-code')&&forms.includes(String(store.get('kid-code')).toUpperCase()))store.del('kid-code');
    b.textContent='✓ אופס';b.disabled=true}));
}


/* ---------- world interactivity ---------- */
(function(){const W=document.getElementById('world');if(!W)return;
  document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;W.style.setProperty('--px',-x);W.style.setProperty('--py',-y)});
  const burst=(x,y)=>{const sy=['⭐','✨','💫','🌟','💖','🫧'];for(let i=0;i<8;i++){const b=document.createElement('span');b.className='burst';b.textContent=sy[i%sy.length];
      const a=i/8*Math.PI*2,r=60+Math.random()*40;b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--dx',Math.cos(a)*r+'px');b.style.setProperty('--dy',Math.sin(a)*r+'px');
      document.body.appendChild(b);setTimeout(()=>b.remove(),950)}try{SFX.blip()}catch(e){}};
  document.addEventListener('pointerdown',e=>{const t=e.target;if(t.closest('button,input,a,label,textarea,select,.card,.overlay,.top,.brand'))return;burst(e.clientX,e.clientY)});
})();

/* ---------- start ---------- */
function isAdmin(){return location.hash==='#therapist'||location.hash==='#admin'}
window.addEventListener('hashchange',()=>{if(!isAdmin()&&S.view==='therapist')S.view=S.bits===null?'login':'home';render()});
/* realistic word pictures (words-*.js, Gemini): an element whose whole text is one emoji we have a picture for
   shows the picture instead (in every game, for every sound and goal). A picture blocked by a network filter keeps the emoji */
function swapPics(root){const W=window.WORD_IMG;if(!W||!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const hits=[];
  while(tw.nextNode()){const t=tw.currentNode,v=t.nodeValue.trim();if(v.length<=4&&W[v]&&okImg(W[v])&&t.parentNode&&!t.parentNode.closest('.top,.ghost,.stars,textarea,option'))hits.push([t,v])}
  hits.forEach(([t,v])=>{const im=document.createElement('img');im.className='wimg';im.src=W[v];im.alt=v;t.parentNode.replaceChild(im,t)})}
let swapQ=false;new MutationObserver(()=>{if(swapQ||!window.WORD_IMG)return;swapQ=true;requestAnimationFrame(()=>{swapQ=false;swapPics(document.body)})}).observe(document.body,{childList:true,subtree:true});
setTimeout(()=>loadScriptOnce('words-1.js?v=1',()=>swapPics(document.body)),800);const saved=store.get('kid-code');if(saved){const nb=replacedBy(saved);if(!nb&&isBlocked(saved))store.del('kid-code');else if(!login(saved))store.del('kid-code')}
render();
</script>
